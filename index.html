<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Inkly · Google Drive</title>
<style>
html, body { margin: 0; height: 100%; background: transparent; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; }
#note { display: none; max-width: 560px; margin: 80px auto; padding: 0 24px; }
</style>
</head>
<body>
<div id="note">
<h1>Inkly · Google Drive</h1>
<p>This page shows Google's Drive picker for Inkly Documents. It does nothing on its own: open an Inkly Document in Chrome and choose <strong>Open from Google Drive</strong>, <strong>Import file › From Google Drive</strong>, <strong>Insert image › From Google Drive</strong> or <strong>Choose folder…</strong>.</p>
</div>
<script>
// Inkly D6.29: Google's Drive picker for Inkly Documents.
// Inkly Documents run inside the Inkly Chrome extension, where Google's picker
// script can't load. The document shows this page over itself and sends it the
// teacher's Drive sign-in; this page shows Google's picker and sends back the file
// or folder picked. Nothing is stored and nothing is sent anywhere else.
(() => {
  "use strict";
  if (window.parent === window) { document.getElementById("note").style.display = "block"; return; }
  let parentOrigin = null, nonce = null;
  const post = payload => { if (parentOrigin) window.parent.postMessage({ inklyDrivePicker: nonce, ...payload }, parentOrigin); };

  window.addEventListener("message", event => {
    // Only the Inkly extension page that shows this page, once.
    if (parentOrigin || event.source !== window.parent || !/^chrome-extension:\/\/[a-p]{32}$/.test(event.origin)) return;
    const config = event.data;
    if (!config || config.inklyHostedPicker !== "config" || typeof config.nonce !== "string" || typeof config.token !== "string" || typeof config.apiKey !== "string") return;
    parentOrigin = event.origin; nonce = config.nonce;
    void openPicker(config);
  });
  // No sign-in in this message: only "ready".
  window.parent.postMessage({ inklyHostedPickerReady: true }, "*");

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src; script.async = true;
      script.onload = resolve;
      script.onerror = () => reject(new Error("Google's picker script could not load (network or content filter)"));
      document.head.appendChild(script);
    });
  }

  async function openPicker(config) {
    try {
      if (!window.gapi?.load) await loadScript("https://apis.google.com/js/api.js");
      await new Promise((resolve, reject) => window.gapi.load("picker", {
        callback: resolve, onerror: () => reject(new Error("the picker failed to load")),
        timeout: 15000, ontimeout: () => reject(new Error("the picker timed out"))
      }));
      const p = window.google.picker;
      const purpose = ["pages", "image", "folder", "open"].includes(config.purpose) ? config.purpose : "pages";
      const label = (view, text) => { if (typeof view.setLabel === "function") view.setLabel(text); return view; };
      let views, title;
      if (purpose === "folder") {
        title = "Choose a Google Drive folder";
        const folders = (text, setup) => label(setup(new p.DocsView(p.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true).setMimeTypes("application/vnd.google-apps.folder")), text);
        views = [folders("My Drive", view => view.setParent("root")), folders("Shared with me", view => view.setOwnedByMe(false)), folders("Shared drives", view => view.setEnableDrives(true))];
      } else {
        const types = purpose === "image" ? "image/png,image/jpeg,image/webp"
          : purpose === "open" ? "application/vnd.inkly.document,application/x-inkly"
          : "application/pdf,application/vnd.google-apps.document,application/vnd.google-apps.presentation,application/vnd.inkly.document,application/x-inkly,application/json";
        title = purpose === "image" ? "Insert an image from Google Drive" : purpose === "open" ? "Open an Inkly file from Google Drive" : "Add pages from Google Drive";
        // Images and PDFs show as thumbnails; Inkly files as a list.
        const docs = mode => {
          const view = new p.DocsView(p.ViewId.DOCS).setMimeTypes(types);
          return mode && p.DocsViewMode?.[mode] ? view.setMode(p.DocsViewMode[mode]) : view;
        };
        const mode = purpose === "open" ? "LIST" : "GRID";
        views = [
          ...(purpose === "open" && /^[A-Za-z0-9_-]{10,200}$/.test(config.folderId || "") ? [label(docs("LIST").setIncludeFolders(true).setParent(config.folderId), "Inkly Files")] : []),
          label(docs(mode), "Recent"),
          label(docs(mode).setIncludeFolders(true).setParent("root"), "My Drive"),
          label(docs(mode).setOwnedByMe(false), "Shared with me"),
          label(docs(mode).setIncludeFolders(true).setEnableDrives(true), "Shared drives"),
          new p.DocsUploadView().setIncludeFolders(true)
        ];
      }
      const builder = new p.PickerBuilder()
        .setTitle(title)
        .setOAuthToken(config.token)
        .setDeveloperKey(config.apiKey)
        .setOrigin(window.location.origin)
        .enableFeature(p.Feature.SUPPORT_DRIVES)
        .setCallback(data => {
          const action = data?.[p.Response.ACTION];
          if (action === p.Action.PICKED) {
            const doc = data[p.Response.DOCUMENTS]?.[0] || {};
            post({ picked: { id: doc[p.Document.ID] || doc.id, name: doc[p.Document.NAME] || doc.name || "", mimeType: doc[p.Document.MIME_TYPE] || doc.mimeType || "" } });
          } else if (action === p.Action.CANCEL) post({ cancelled: true });
        });
      for (const view of views) builder.addView(view);
      if (/^[0-9]{6,20}$/.test(String(config.appId || ""))) builder.setAppId(String(config.appId));
      if (typeof builder.setSize === "function") builder.setSize(Math.max(600, Math.min(1051, window.innerWidth - 40)), Math.max(420, Math.min(650, window.innerHeight - 80)));
      builder.build().setVisible(true);
      post({ opened: true });
    } catch (error) {
      post({ error: String(error?.message || error) });
    }
  }
})();
</script>
</body>
</html>
